services:
  # 1. Express Backend API + MongoDB Demo Wallet + Cloudinary NFT Service
  - type: web
    name: cryptoart-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false

  # 2. Separate Solidity Contracts RPC & Auto-Deployment Service
  - type: web
    name: cryptoart-contracts
    runtime: node
    rootDir: contracts
    plan: free
    buildCommand: npm install && npm run compile
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
