<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD36B"/>
      <stop offset="100%" stop-color="#C98A1A"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9D9D9"/>
      <stop offset="100%" stop-color="#7A7A7A"/>
    </linearGradient>
  </defs>

  <!-- Crescent -->
  <path d="M65 15 
           A35 35 0 1 0 65 85 
           A25 25 0 1 1 65 15 Z"
        fill="url(#silverGrad)"/>

  <!-- Stylized A -->
  <path d="M30 75 L50 25 L70 75 L60 75 L55 60 L45 60 L40 75 Z"
        fill="url(#goldGrad)"/>

  <!-- Cube -->
  <rect x="62" y="38" width="18" height="18"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="4"/>

  <!-- Flame Top -->
  <path d="M70 20 
           C75 30, 85 35, 70 45 
           C60 35, 65 28, 70 20 Z"
        fill="url(#goldGrad)"/>
</svg>





